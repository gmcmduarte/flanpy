[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "flanpy"
version = "0.1.0"
description = "Analytic combinatorics toolchain for algebraic generating functions in descriptional complexity."
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Guilherme Duarte" }]
keywords = [
    "analytic combinatorics",
    "generating functions",
    "singularity analysis",
    "descriptional complexity",
    "formal languages",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "sympy>=1.14",
    "mpmath>=1.3",
]

[project.optional-dependencies]
fast = ["python-flint>=0.7"]
dev = [
    "hypothesis>=6.100",
    "numpydoc>=1.8",
    "pytest>=9.0",
    "ruff>=0.15",
    "mypy>=2.0",
    "build>=1.2",
    "twine>=6.1",
]
docs = [
    "jupytext>=1.16",
    "sphinx>=8.2",
    "shibuya>=2025.1",
    "myst-parser>=4.0",
    "myst-nb>=1.2",
    "sphinxcontrib-bibtex>=2.6",
]

[project.urls]
Documentation = "https://flanpy.readthedocs.io/"
Source = "https://github.com/gmcmduarte/flanpy"
Issues = "https://github.com/gmcmduarte/flanpy/issues"
Changelog = "https://github.com/gmcmduarte/flanpy/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/flanpy"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/CONTRIBUTING.md",
]
# docs/examples is a symlink to examples/; ship the real files only (hatch would
# otherwise keep one copy, under docs/examples).
exclude = ["/docs/_build", "/docs/examples"]

[tool.hatch.build.targets.sdist.force-include]
"examples" = "examples"

# --- ruff -------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]
# dev/spikes holds throwaway exploration code; it is kept for reference only.
extend-exclude = ["dev/spikes"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "D",   # pydocstyle
]
# KSet prints in set notation: [1, 53] ∪ [55, ∞) (RUF001-RUF003); the singularity
# docstrings use the papers' notation ρ (radius), σ (a candidate singularity) and ℓ
# (a lower bound, Pivoteau-Salvy 2025); the newton docstrings α (the singular exponent,
# Broda et al. 2020 eq. (20)) and γ (a Newton-polygon slope).
allowed-confusables = ["∪", "ρ", "σ", "ℓ", "α", "γ", "ν"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"docs/**" = ["D"]
# Running examples are jupytext notebooks: the first markdown cell is the module
# docstring (a real docstring would render as a code cell).
"examples/**" = ["D100"]

[tool.ruff.format]
docstring-code-format = true

# --- mypy -------------------------------------------------------------------

[tool.mypy]
python_version = "3.13"
files = ["src", "tests", "examples"]
strict = true
warn_unreachable = true

# SymPy and numpydoc ship no type information (no py.typed marker).
[[tool.mypy.overrides]]
module = ["sympy", "sympy.*", "numpydoc", "numpydoc.*", "mpmath", "mpmath.*"]
ignore_missing_imports = true

# python-flint is optional (the `fast` extra); it ships py.typed when installed.
[[tool.mypy.overrides]]
module = ["flint", "flint.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# --- pytest -----------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests", "src/flanpy"]
# Test helpers (tests/_enumerate.py) are imported as top-level modules.
pythonpath = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--doctest-modules",
    "--import-mode=importlib",
    # Slow tests (N = 1000) run in their own CI job: pytest -m slow
    "-m",
    "not slow",
]
markers = ["slow: long-running tests (N = 1000); run with pytest -m slow"]
xfail_strict = true
filterwarnings = ["error"]
