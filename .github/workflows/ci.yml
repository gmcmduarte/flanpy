name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Both coefficient backends are exercised: Python 3.13 installs the `fast` extra
  # (python-flint), so tests run on both backends; the newest Python installs no
  # extra, so the pure-Python fallback is tested where flint wheels may lag.
  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.13"
            extras: "dev,fast"
            backend: flint
          - python-version: "3.x"
            extras: "dev"
            backend: python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: false
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[${{ matrix.extras }}]"
      - name: Record Python version and backend
        run: |
          backend=$(python -c 'from flanpy._rings import backend; print(backend().name)')
          echo "### Python $(python -c 'import platform; print(platform.python_version())') (matrix: ${{ matrix.python-version }}), backend: $backend" >> "$GITHUB_STEP_SUMMARY"
          test "$backend" = "${{ matrix.backend }}"
      - name: Lint (ruff)
        run: |
          ruff check --output-format=github .
          ruff format --check .
      - name: Types (mypy)
        run: mypy
      - name: Tests (pytest)
        run: pytest
      - name: Build sdist and wheel
        run: python -m build

  slow:
    name: Slow tests (Python ${{ matrix.python-version }}, ${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.13"
            extras: "dev,fast"
            backend: flint
          - python-version: "3.x"
            extras: "dev"
            backend: python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: false
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[${{ matrix.extras }}]"
      - name: Slow tests (pytest -m slow)
        run: pytest -m slow --durations=0

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"
      - name: Build docs
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Run documentation doctests
        run: sphinx-build -W --keep-going -b doctest docs docs/_build/doctest
